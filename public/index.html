<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexTeen | Login</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e293b 0%, var(--primary) 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        .logo {
            position: absolute;
            top: 30px;
            left: 30px;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 2px;
        }

        
        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); 
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 300px;
            height: auto;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h1 { margin: 0 0 10px 0; font-size: 28px; }
        p { color: #cbd5e1; margin-bottom: 30px; font-size: 14px; }

        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            box-sizing: border-box; 
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.4);
        }

        
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: white;
            color: var(--primary);
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: #f1f5f9;
        }
    </style>
</head>
<body>

    <div class="logo">NEXTEEN</div>

    <div class="login-card">
        <h1>LOG IN.</h1>
        <p>Welcome to NexTeen!</p>

        <div class="input-group">
            <input type="email" id="email" placeholder="Email адрес">
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="Құпия сөз">
        </div>

        <button class="login-btn">Кіру</button>
        
        <p style="margin-top: 20px; font-size: 12px;">
            Тіркелмегенсіз бе? <a href="signup.htmlyhfrhtyuitgjfhvgħuth gl;" style="color: white; font-weight: bold;">Тіркелу</a>
        </p>
    </div>
<script type="module"> 
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCmZUGTgPrmXFQbUUO1xXCqeD70P6Sy0Bk",
        authDomain: "nexteen1.firebaseapp.com",
        projectId: "nexteen1",
        storageBucket: "nexteen1.firebasestorage.app",
        messagingSenderId: "346706382944",
        appId: "1:346706382944:web:d56b666e109f1695b63305"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    
    const loginBtn = document.querySelector('.login-btn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    loginBtn.addEventListener('click', async () => {
        const email = emailInput.value;
        const password = passwordInput.value;

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            alert("Кіру сәтті аяқталды!");
            window.location.href = "dashboard.html";
        } catch (error) {
            console.error("Error code:", error.code);
            alert("Қате: " + error.message);
        }
    });
</script>
</body>
</html>

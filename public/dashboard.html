<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexTeen | Басты бет</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { 
            --primary: #4f46e5; 
            --bg: #0f172a; 
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0; 
            background: var(--bg);
            color: white; 
            min-height: 100vh;
            padding-bottom: 80px; 
        }

       
        nav {
            background: var(--card-bg);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-weight: 900; letter-spacing: 2px; color: var(--primary); font-size: 20px; }

        .logout-btn {
            background: #ef4444; color: white; border: none;
            padding: 8px 12px; border-radius: 8px; cursor: pointer;
            font-weight: bold; font-size: 12px; transition: 0.3s;
        }

        .logout-btn:hover { background: #b91c1c; }

        
        .main-content {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .welcome-card {
            background: linear-gradient(135deg, var(--primary), #312e81);
            padding: 30px;
            border-radius: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3);
        }

        .welcome-card h1 { margin: 0; font-size: 24px; }
        .welcome-card p { opacity: 0.8; font-size: 14px; margin-top: 5px; }

       
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            gap: 4px;
            transition: 0.3s;
            flex: 1;
        }

        .nav-item i { font-size: 20px; }

        .nav-item.active { color: white; }
        .nav-item.active i { color: var(--primary); }

        
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .menu-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
            text-decoration: none;
            color: white;
        }

        .menu-card:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-5px); }
        .menu-card i { font-size: 24px; color: var(--primary); margin-bottom: 10px; display: block; }
        .menu-card span { font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">NEXTEEN</div>
        <button class="logout-btn" id="logoutBtn">Шығу</button>
    </nav>

    <div class="main-content">
        <div class="welcome-card">
            <h1>Сәлем, <span id="userName">Досым</span>! 👋</h1>
            <p id="userEmail">Жүктелуде...</p>
        </div>

        <div class="grid-menu">
            <a href="#" class="menu-card">
                <i class="fas fa-trophy"></i>
                <span>Лидерборд</span>
            </a>
            <a href="#" class="menu-card">
                <i class="fas fa-users"></i>
                <span>Команда табу</span>
            </a>
            <a href="#" class="menu-card">
                <i class="fas fa-briefcase"></i>
                <span>Тапсырыстар</span>
            </a>
            <a href="#" class="menu-card">
                <i class="fas fa-rocket"></i>
                <span>Жобаларым</span>
            </a>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item active">
            <i class="fas fa-house"></i>
            <span>Басты</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-chart-line"></i>
            <span>Рейтинг</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-search-plus"></i>
            <span>Іздеу</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-user-circle"></i>
            <span>Профиль</span>
        </a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        
        const firebaseConfig = {
            apiKey: "AIzaSyCmZUGTgPrmXFQbUUO1xXCqeD70P6Sy0Bk",
            authDomain: "nexteen1.firebaseapp.com",
            projectId: "nexteen1",
            storageBucket: "nexteen1.firebasestorage.app",
            messagingSenderId: "346706382944",
            appId: "1:346706382944:web:d56b666e109f1695b63305"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const userNameSpan = document.getElementById('userName');
        const userEmailP = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');

        
        onAuthStateChanged(auth, (user) => {
            if (user) {
                userNameSpan.innerText = user.displayName || "Пайдаланушы";
                userEmailP.innerText = user.email;
            } else {
                
                window.location.href = "index.html";
            }
        });

        
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
